<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>let-t-make</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>let-t-make</h1>
      <p>Upload HTML, CSS, or JavaScript files to create a web address.</p>

      <div id="dropZone" class="drop-zone">
        <strong>Drag files here</strong>
        <span>or</span>
        <label class="file-btn">
          Choose Files
          <input id="fileInput" type="file" multiple accept=".html,.css,.js" />
        </label>
      </div>

      <h2>Files</h2>
      <ul id="fileList"></ul>

      <button id="makeBtn" class="main-btn">Create Address</button>

      <div id="resultBox" class="result hidden">
        <p>Created Address</p>
        <a id="createdLink" href="#" target="_blank"></a>
      </div>
    </section>

    <section class="card">
      <h2>Saved</h2>
      <div id="savedList"></div>
      <button id="clearBtn" class="sub-btn">Clear Saved</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
